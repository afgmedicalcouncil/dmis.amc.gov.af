<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Yourself with Afghanistan Medical Council</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 32px 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 28px;
            color: #ffffff;
        }

        .input-group {
            text-align: left;
            margin-bottom: 24px;
        }

        .label {
            display: block;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            background-color: #0b0f19;
            border: 1px solid #2563eb;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field::placeholder {
            color: #64748b;
        }

        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .divider {
            height: 1px;
            background-color: #1e293b;
            margin: 24px 0;
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-secondary {
            background-color: #1d3557;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background-color: #2a4a75;
        }

        .btn-primary {
            background-color: #0284c7;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h1 class="title">Verify Yourself with Afghanistan Medical Council</h1>
        
        <div class="input-group">
            <label class="label">AMC Registration Number:</label>
            <input type="text" class="input-field" placeholder="Please Enter AMC Registration Number">
        </div>

        <div class="divider"></div>

        <div class="button-group">
            <button class="btn btn-secondary">BACK TO LOGIN</button>
            <button class="btn btn-primary">SEARCH</button>
        </div>
    </div>

</body>
</html>
